<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Updates — Armonía Connect</title>
<link rel="icon" href="/armonia-connect-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --cream: #F2EBD9;
    --charcoal: #0E0D0B; --charcoal-2: #141310; --charcoal-3: #1C1A16;
    --text-muted: #8A8275; --border-gold: rgba(201,168,76,0.28);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--charcoal); color: var(--cream); font-family: var(--font-sans); min-height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border-gold); background: var(--charcoal-2); }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .brand img { width: 34px; height: 34px; }
  .brand-text .l1 { font-family: var(--font-display); font-size: 1.05rem; color: var(--gold-light); line-height: 1.1; }
  .brand-text .l2 { font-size: 0.6rem; letter-spacing: 2px; color: var(--text-muted); }
  .back-link { color: var(--gold-light); text-decoration: none; font-size: 0.85rem; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 100px; }
  h1 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 8px; }
  .lead { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 40px; }
  .update-card { border: 1px solid var(--border-gold); background: var(--charcoal-2); padding: 22px 24px; margin-bottom: 16px; }
  .update-title { font-family: var(--font-display); font-size: 1.2rem; color: var(--gold-light); margin-bottom: 6px; }
  .update-time { font-size: 0.74rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .update-body { font-family: var(--font-serif, Georgia); font-size: 1rem; line-height: 1.7; color: var(--cream); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/course/dashboard.html">
      <img src="/armonia-connect-logo.png" alt="Armonía Connect">
      <div class="brand-text"><div class="l1">Armonía Connect</div><div class="l2">ALL-STATE ETUDE STUDIES</div></div>
    </a>
    <a class="back-link" href="/course/dashboard.html">← Back to Dashboard</a>
  </header>

  <div class="wrap">
    <h1>Course Updates</h1>
    <p class="lead">New lessons, resources, and changes to the course, as they're added.</p>
    <div id="updatesList"><p class="empty-state">Loading…</p></div>
  </div>

<script>
const token = localStorage.getItem('armonia_session');
if (!token) window.location.href = '/course/';

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

(async function init() {
  try {
    const res = await fetch('/api/course-updates', { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load updates.');

    const host = document.getElementById('updatesList');
    host.innerHTML = data.updates.length
      ? data.updates.map(u => `
        <div class="update-card">
          <div class="update-title">${u.title}</div>
          <div class="update-time">${timeAgo(u.published_at)}</div>
          <div class="update-body">${(u.body || '').replace(/</g,'&lt;')}</div>
        </div>`).join('')
      : '<p class="empty-state">No course updates yet — check back as new lessons and resources are added.</p>';

    // Mark everything seen now that they've viewed the full list.
    fetch('/api/course-updates', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } }).catch(() => {});
  } catch (err) {
    document.getElementById('updatesList').innerHTML = `<p class="empty-state">${err.message}</p>`;
  }
})();
</script>
</body>
</html>
